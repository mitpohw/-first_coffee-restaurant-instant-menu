<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="First Coffee Restaurant — Admin Login">
    <title>Admin Login — First Coffee Restaurant</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-family='serif'>☕</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="admin-login-app">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <h1 class="login-title">First Coffee</h1>
                    <p class="login-subtitle">Admin Portal</p>
                </div>

                <form id="login-form" class="login-form">
                    <div class="form-group">
                        <label for="login-username">Username</label>
                        <input id="login-username" type="text" required autocomplete="username" placeholder="Enter username">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input id="login-password" type="password" required autocomplete="current-password" placeholder="Enter password">
                    </div>
                    <button type="submit" class="btn btn-primary login-btn">Sign In</button>
                </form>

                <div id="login-error" class="login-error" hidden></div>
                <div id="login-loading" class="login-loading" hidden>
                    <div class="spinner"></div>
                    <p>Authenticating...</p>
                </div>
            </div>

            <div class="login-footer">
                <p>Powered by: Neon solutions-michael luel</p>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin-login.js"></script>
</body>
</html>
