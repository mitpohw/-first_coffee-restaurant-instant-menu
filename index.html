<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1A1412">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="First Coffee Restaurant — Instant Digital Menu">
    <title>First Coffee Restaurant</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-family='serif'>☕</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Motion One (Framer Motion standalone equivalent) -->
    <script src="https://cdn.jsdelivr.net/npm/@motionone/dom@10.18.0/dist/motion-one.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        if (window.tailwind) {
            window.tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            'charcoal': '#1A1412',
                            'champagne': '#D4A373',
                            'champagne-light': '#E6C99D',
                            'ivory': '#FAF7F2',
                            'ivory-dark': '#2C1810'
                        },
                        fontFamily: {
                            'serif-display': ['Playfair Display', 'Georgia', 'serif'],
                            'sans-body': ['Inter', 'system-ui', 'sans-serif']
                        }
                    }
                }
            };
        }
    </script></head>
<body>
    <div id="app">
        <!-- Customer Menu View -->
        <div id="menu-view" class="view">
            <header class="site-header">
                <div class="container">
                <div class="brand">
                    <div class="brand-logo" aria-hidden="true">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>
                    </div>
                    <h1 class="brand-name">First Coffee</h1>
                    <p class="brand-tagline">Restaurant</p>
                </div>
                    <div class="header-actions">
                        <button id="search-toggle" class="icon-btn" aria-label="Search menu" title="Search">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                        </button>
                        <button id="admin-toggle" class="icon-btn" aria-label="Admin panel" title="Manage Menu">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                        </button>
                    </div>
                </div>
            </header>

            <div id="search-bar" class="search-bar" hidden>
                <div class="container">
                    <div class="search-input-wrap">
                        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                        <input type="text" id="search-input" placeholder="Search menu..." autocomplete="off">
                        <button id="search-close" class="icon-btn" aria-label="Close search">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <nav id="category-nav" class="category-nav" aria-label="Menu categories">
                <div class="category-nav-inner">
                    <button class="cat-btn active" data-cat="all">All Menu</button>
                </div>
            </nav>

            <!-- Advanced Filters -->
            <div id="filter-bar" class="filter-bar" hidden>
                <div class="container">
                    <div class="filter-row">
                        <div class="filter-group">
                            <label class="filter-label">Dietary</label>
                            <div class="filter-chips">
                                <button class="filter-chip active" data-filter="dietary" data-value="all">All</button>
                                <button class="filter-chip" data-filter="dietary" data-value="vegan">Vegan</button>
                                <button class="filter-chip" data-filter="dietary" data-value="vegetarian">Vegetarian</button>
                                <button class="filter-chip" data-filter="dietary" data-value="gluten-free">Gluten-Free</button>
                                <button class="filter-chip" data-filter="dietary" data-value="dairy-free">Dairy-Free</button>
                            </div>
                        </div>
                        <div class="filter-group">
                            <label class="filter-label">Price Range</label>
                            <div class="filter-chips">
                                <button class="filter-chip active" data-filter="price" data-value="all">All</button>
                                <button class="filter-chip" data-filter="price" data-value="0-100">Under 100 ETB</button>
                                <button class="filter-chip" data-filter="price" data-value="100-250">100 - 250 ETB</button>
                                <button class="filter-chip" data-filter="price" data-value="250+">250+ ETB</button>
                            </div>
                        </div>
                        <button id="clear-filters" class="clear-filters-btn">Clear All</button>
                    </div>
                </div>
            </div>

            <main id="menu-main" class="menu-main">
                <div class="container">
                    <div id="featured-section" class="featured-section" hidden>
                        <h2 class="section-title">Featured</h2>
                        <div id="featured-grid" class="featured-grid"></div>
                    </div>
                    <div id="menu-content"></div>
                    <div id="empty-state" class="empty-state" hidden>
                        <p class="empty-icon">🍽️</p>
                        <p class="empty-text">No items found</p>
                    </div>
                </div>
            </main>

            <button id="back-to-top" class="back-to-top" hidden aria-label="Back to top" title="Back to top">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
            </button>

            <footer class="site-footer">
                <div class="container">
                    <div class="footer-info">
                        <p id="footer-address" class="footer-address"></p>
                        <p id="footer-hours" class="footer-hours"></p>
                        <div class="footer-social" id="footer-social"></div>
                    </div>
                    <p class="footer-copy">&copy; <span id="current-year"></span> First Coffee Restaurant</p>
                    <p class="footer-powered">Powered by: Neon solutions-michael luel</p>
                </div>
            </footer>
        </div>

        <!-- Item Detail Modal -->
        <div id="item-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <button class="modal-close" aria-label="Close details">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
                <div id="modal-body"></div>
            </div>
        </div>

        <!-- Image Zoom Overlay -->
        <div id="image-zoom" class="image-zoom-overlay" aria-hidden="true">
            <img id="zoom-img" alt="" src="">
        </div>

        <!-- Toast -->
        <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
